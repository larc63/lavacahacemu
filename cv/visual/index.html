<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

		<title>Luis A. Rodriguez - Visual Resume</title>

		<link rel="stylesheet" href="dist/reset.css">
		<link rel="stylesheet" href="dist/reveal.css">
		<link rel="stylesheet" href="dist/theme/simple.css">

		<!-- Theme used for syntax highlighted code -->
		<link rel="stylesheet" href="plugin/highlight/monokai.css">
		<style>
			.banner{
				position: absolute;
				top: 10px;
				right: 10px;
				display: flex;
				text-decoration: none;
			}

			.banner-item a {
				display: flex;
				flex-direction: column;
				align-items: center;
				text-decoration: none;
			}
			.item-text {
				color: black;
			}
		</style>
	</head>
	<body>
		<div class="reveal">
			<div class="slides">
				<!-- <section>Slide 1</section> -->
				<!-- <section>Slide 2</section> -->
				
				<section data-markdown="slides.md"
					data-separator="^\n\n\n"
					data-separator-vertical="^\n\n"
					data-separator-notes="^Note:"
					data-charset="utf-8">
				</section>
			</div>
		</div>

		<script src="dist/reveal.js"></script>
		<script src="plugin/notes/notes.js"></script>
		<script src="plugin/markdown/markdown.js"></script>
		<script src="plugin/highlight/highlight.js"></script>
		<!-- <script src="plugin/tableofcontents/tableofcontents.js"> -->
		<script>
			// More info about initialization & config:
			// - https://revealjs.com/initialization/
			// - https://revealjs.com/config/
			Reveal.initialize({
				hash: true,
				
				// Learn about plugins: https://revealjs.com/plugins/
				plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ],
			});
			// setTimeout(() => {
			// 	Reveal.toggleOverview(true);
			// }, 300);
		</script>
		<div class="banner">
			<div class="banner-item">
				<a href="../Resume.html">
					<img src="images/resume.png" width="100" height="100" class="item-image">
					<div class="item-text">Go To Resume</div>
				</a>
			</div>
			<div class="banner-item">
				<a href="../Curriculum Vitae.html">
					<img src="images/cv.png" width="100" height="100" class="item-image">
					<div class="item-text">Go To CV</div>
				</a>
			</div>
		</div>
		<div class="instructions">

		</div>
	</body>
</html>
